name: Update proxy IP data

on:
  schedule:
    - cron: "23 */6 * * *"  # every 6 hours
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe proxy IPs
        run: python3 scripts/update.py

      - name: Commit data.json
        run: |
          git config user.name "proxyip-board"
          git config user.email "proxyip-board@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: refresh proxy IP data"
            git push
          fi
